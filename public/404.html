<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMT Diagnostics</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;

      var l = window.location;
      var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      
      // Auto-redirect to hash route
      var targetPath = l.pathname.replace(/^\/+/, '');
      if (targetPath) {
        window.location.replace(l.protocol + '//' + l.host + '/#/' + targetPath + (l.search || '') + (l.hash || ''));
      } else {
        window.location.replace(l.protocol + '//' + l.host + '/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">BMT Diagnostics</a>...</p>
  </body>
</html>
